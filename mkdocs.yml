site_name: Flet-Easy
site_url: https://daxexs.github.io/flet-easy/
site_author: Daxexs
site_description: >-
  Flet-Easy is a user-friendly add-on package for Flet, offering a cleaner code structure with numerous customizable features like JWT, routers, decorators, middleware and more.
edit_uri: edit/main/docs/
copyright: Copyright &copy; <span id="dynamic-year"></span> Daxexs
repo_name: Daxexs/flet-easy
repo_url: https://github.com/Daxexs/flet-easy

theme:
  custom_dir: docs/overrides
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Lexend
    code: Fira Code
    font: false
  language: en
  direction: ltr
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  icon:
    edit: material/pencil-remove-outline
    view: material/eye
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit

plugins:
  - search:
      lang:
        - en
        - es
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
      cache_safe: true

extra_css:
  - stylesheets/extra.css

extra:
  status:
    new: Recently added
    deprecated: Deprecated
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Daxexs/flet-easy
      name: Repository
  generator: false
  analytics:
    provider: google
    property: G-04BJVP28P7
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
  seo:
    meta:
      - name: description
        content: "Flet-Easy: A comprehensive Python framework for building modern Flet applications with advanced routing, JWT authentication, middleware, and responsive design capabilities."
      - name: keywords
        content: "Flet, flet-easy, Python GUI, web framework, desktop apps, mobile apps, JWT authentication, routing, middleware, decorators, responsive design, MVC pattern, CLI tools"
      - name: author
        content: "Daxexs"
      - name: robots
        content: "index, follow"
      - property: "og:type"
        content: "website"
      - property: "og:title"
        content: "Flet-Easy Documentation - Modern Python GUI Framework"
      - property: "og:description"
        content: "Complete guide to Flet-Easy: Build beautiful desktop, web, and mobile apps with Python using advanced routing, authentication, and responsive design."
      - property: "og:url"
        content: "https://daxexs.github.io/flet-easy/"
      - property: "og:image"
        content: "https://daxexs.github.io/flet-easy/assets/images/logo.png"
      - name: "twitter:card"
        content: "summary_large_image"
      - name: "twitter:title"
        content: "Flet-Easy Documentation - Modern Python GUI Framework"
      - name: "twitter:description"
        content: "Complete guide to Flet-Easy: Build beautiful desktop, web, and mobile apps with Python using advanced routing, authentication, and responsive design."

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home:
      - Home: index.md
      - Documentation Structure: documentation-structure/index.md
  - Getting Started:
      - Installation: started/installation.md
      - Quick Start: started/begin.md
      - Basic Usage: started/how-to-use.md
      - Running Your App: started/run-the-app.md
  - User Guide:
      - Core Framework:
          - FletEasy Class: guide/core/fletEasy.md
          - Datasy Object: guide/core/datasy.md
          - Page Management: guide/core/pagesy.md
          - View System: guide/core/viewsy.md

      - Adding Pages:
          - Through Decorators: guide/add-pages/through-decorators.md
          - Using Functions: guide/add-pages/using-functions.md
          - Using Classes: guide/add-pages/through-classes.md
          - Automatic Routing: guide/add-pages/in-automatic.md
      - Routing & Navigation:
          - Declarative Routing: guide/routing/declarative.md
          - Imperative Routing: guide/routing/imperative.md
          - Dynamic Routes: guide/routing/dynamic-routes.md
          - Navigation Methods: guide/routing/navigation.md

  - Advanced Features:
      - Route Protection: advanced/route-protection.md
      - Data Sharing: advanced/data-sharing-between-pages.md
      - Middleware System: advanced/middleware.md
      - Page Caching: advanced/page-caching.md
      - JWT Authentication: advanced/basic-jwt.md
      - Responsive Controls: advanced/responsiveControlsy.md
      - Reference System: advanced/ref.md
      - Event Handling:
          - Keyboard Events: advanced/events/keyboard-event.md
          - Resize Events: advanced/events/on-resize.md
          - Custom Events: advanced/events/handle.md
      - Configuration:
          - App Settings: advanced/configuration/general.md
          - View Configuration: advanced/configuration/control-view.md
          - Custom 404 Pages: advanced/configuration/page-404.md
      - Integration:
          - Working with Other Apps: advanced/integration/working-with-other-apps.md
  - Examples:
      - Examples Gallery: examples/gallery.md
      - v0.3.0 Feature Showcase: examples/v0-3-0-showcase.md
      - Migration Guide v0.2.0 to v0.3.0: examples/migration-v0.2.0-to-v0.3.0.md
  - API Reference:
      - Complete API Documentation: api/reference.md
  - Development:
      - CLI Tools:
          - Commands: cli/commands.md
          - Project Creation: cli/create-app.md
  - Changelog:
      - Release Notes: changelog.md

extra_javascript:
  - assets/js/dynamic-year.js
