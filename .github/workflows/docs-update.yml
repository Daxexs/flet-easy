name: Deploy docs-site

on:
  workflow_dispatch:

  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
    branches:
      - "**"

  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv environment
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Set Release Tag Version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=""
          fi
          echo "RELEASE_TAG_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: uv sync --group docs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy Documentation
        run: |
          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/docs-site:refs/remotes/origin/docs-site || true

          BRANCH="${{ github.ref_name }}"

          # PRODUCTION
          if [ "${{ github.event_name }}" = "release" ] || [ "$BRANCH" = "main" ]; then

            VERSION="${RELEASE_TAG_VERSION}"

            if [ -z "$VERSION" ]; then
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
            fi

            if [ -z "$VERSION" ]; then
              VERSION="latest"
            fi

            echo "Production deploy: $VERSION"

            uv run mike deploy $VERSION latest \
              -b docs-site \
              -p \
              --update-aliases

          # DEV
          else

            echo "Development deploy from branch: $BRANCH"

            uv run mike deploy dev \
              -b docs-site \
              -p \
              --update-aliases

          fi

      - name: Set Default Version
        if: github.event_name == 'release' || github.ref_name == 'main'
        run: |
          uv run mike set-default --push latest --branch docs-site
